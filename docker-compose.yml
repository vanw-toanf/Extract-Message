services:
  api:
    build: .
    container_name: extract-context-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./vietnam_admin_db:/app/vietnam_admin_db:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./benchmark_results:/app/benchmark_results
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
