### Model
model_name_or_path: ../../models/Qwen2.5-7B-Instruct

### Method
stage: sft
do_train: true
finetuning_type: lora

### LoRA config
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### Dataset
# dataset_dir points to folder containing dataset_info.json AND the jsonl files
dataset_dir: ../../data/finetune/qwen_sft
dataset: vin_train
eval_dataset: vin_valid
template: qwen                 # Qwen2.5 chat template
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4

### Training
per_device_train_batch_size: 4
gradient_accumulation_steps: 4   # effective batch = 16
learning_rate: 2.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000

### Eval & logging
eval_strategy: steps
eval_steps: 200
logging_steps: 20
save_strategy: steps
save_steps: 200
save_total_limit: 3
load_best_model_at_end: true

### Output
output_dir: ../../output/qwen25_7b_vin_lora
overwrite_output_dir: true
report_to: none                # đổi thành "wandb" nếu muốn dùng Weights & Biases
